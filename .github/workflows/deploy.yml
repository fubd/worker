name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只跑一个部署，新提交会取消还在跑的旧任务
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # VERCEL_ORG_ID / VERCEL_PROJECT_ID 只是项目标识，不是凭据；
    # 站点静态资源全部由 Vercel 托管，因此缺少 token 时必须让部署失败。
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_YGqOJG3kJ2aprfzzfz5gtMcr
      VERCEL_PROJECT_ID: prj_BM3XiaqbCR5s3KyoYBNOf4kc84am

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Bundle budgets
        run: bun run perf:budget

      # M1 会改变文档 API 的鉴权规则。先完成兼容迁移并发布 Worker，
      # 再切换页面，避免新页面调用旧 API 或旧页面调用新 API 的窗口。
      - name: Apply remote D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy full site to Vercel
        run: bunx vercel@66.6.0 deploy dist/vercel --prod --yes
