name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只跑一个部署，新提交会取消还在跑的旧任务
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # VERCEL_ORG_ID / VERCEL_PROJECT_ID 只是项目标识，不是凭据；
    # 站点静态资源全部由 Vercel 托管，因此缺少 token 时必须让部署失败。
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_YGqOJG3kJ2aprfzzfz5gtMcr
      VERCEL_PROJECT_ID: prj_BM3XiaqbCR5s3KyoYBNOf4kc84am

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check first-screen snapshot
        run: bun run check:first-screen

      - name: Check static about page
        run: bun run check:static-about -- --strict

      # 先发 Vercel 再发 Worker：API 反代目标不能指向还没发布的 Worker。
      - name: Deploy full site to Vercel
        run: bunx vercel@latest deploy dist/vercel --prod --yes

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
