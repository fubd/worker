name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只跑一个部署，新提交会取消还在跑的旧任务
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # VERCEL_ORG_ID / VERCEL_PROJECT_ID 只是项目标识，不是凭据；
    # 真正的 token 走仓库 secret，缺失时跳过 Vercel 步骤（站点会停在旧产物）。
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_YGqOJG3kJ2aprfzzfz5gtMcr
      VERCEL_PROJECT_ID: prj_BM3XiaqbCR5s3KyoYBNOf4kc84am

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check first-screen snapshot
        run: bun run check:first-screen

      - name: Upload static assets to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: bun run upload:oss

      # 先发 Vercel 再发 Worker：API 反代目标不能指向还没发布的 Worker。
      - name: Deploy CN entry to Vercel
        if: env.VERCEL_TOKEN != ''
        run: bunx vercel@latest deploy dist/vercel --prod --yes

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
