name: Performance

on:
  push:
    branches: [main]
    paths:
      - 'src/client/**'
      - 'src/shared/**'
      - 'scripts/build-*.ts'
      - 'scripts/perf-server.ts'
      - 'lighthouserc.json'
      - 'rsbuild.config.ts'
      - 'package.json'
      - 'bun.lock'
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Performance budgets
        run: bun run perf:check
