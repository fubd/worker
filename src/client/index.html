<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Swan Worker</title>
    <!-- react 系模块不打进产物，由 importmap 指向同源路径 /vendor/*。
         vendor 文件由 scripts/build-vendor.ts 生成在 public/vendor/，
         构建时拷进 dist/vendor/，由 Workers Static Assets 直接托管：
         和 /static/* 一样走 Cloudflare 边缘缓存，不再进 Worker 回源 R2。 -->
    <!-- importmap 必须排在所有模块加载（含下面的 modulepreload）之前：
         vendor 文件内部是 `import "react"` 这样的裸说明符，预加载一旦先触发，
         浏览器就要在 importmap 尚未注册时解析依赖，随机报
         Failed to resolve module specifier "react" 并白屏。 -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react-19.3.1.mjs",
          "react/jsx-runtime": "/vendor/react-19.3.1.mjs",
          "react-dom": "/vendor/react-dom-19.3.1.mjs",
          "react-dom/client": "/vendor/react-dom-19.3.1.mjs"
        }
      }
    </script>
    <!-- 外部化后这些依赖不在打包器依赖图里，它不会自动注入 preload；
         不预加载就要等 index.mjs 下载并解析完才知道要请求它们，多一段串行等待。
         同源预取不要加 crossorigin，否则会按 CORS 模式再取一次。 -->
    <link rel="modulepreload" href="/vendor/react-19.3.1.mjs" />
    <link rel="modulepreload" href="/vendor/react-dom-19.3.1.mjs" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
