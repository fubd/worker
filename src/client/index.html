<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Swan Worker</title>
    <!-- react 系模块不打进产物，由 importmap 指向 Cloudflare R2 自定义域名
         桶：swan-vendor（APAC），域名：fbd-oss.cc.cd（已配 CORS + 1 年 immutable 缓存）
         回退方案：把下面 4 个 URL 改回 /vendor/*.mjs 即走同源静态资源 -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://fbd-oss.cc.cd/react.mjs",
          "react/jsx-runtime": "https://fbd-oss.cc.cd/react-jsx-runtime.mjs",
          "react-dom": "https://fbd-oss.cc.cd/react-dom.mjs",
          "react-dom/client": "https://fbd-oss.cc.cd/react-dom-client.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
