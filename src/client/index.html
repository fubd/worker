<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Swan Worker</title>
    <!-- 供 Worker/探针判断当前 HTML 用的是哪套 vendor；CN 版由 scripts/build-cn-html.ts 改写 -->
    <meta name="swan-vendor" content="global-static" />
    <link rel="preconnect" href="https://api.deephos.com" crossorigin />
    <!-- react / react-dom / react-router 不打进产物，由 importmap 指向同源 /vendor/*。
         大陆版 HTML（index-cn.html）会把 importmap 改成 OSS 绝对地址，entry / async /
         antd / vendor 全部从 OSS 加载；首页快照不需要这些。 -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react-19.3.1.mjs",
          "react/jsx-runtime": "/vendor/react-19.3.1.mjs",
          "react-dom": "/vendor/react-dom-19.3.1.mjs",
          "react-dom/client": "/vendor/react-dom-19.3.1.mjs",
          "react-router": "/vendor/router-8.5.1.mjs",
          "react-router/dom": "/vendor/router-8.5.1.mjs"
        }
      }
    </script>
    <!-- 外部化后这些依赖不在打包器依赖图里，它不会自动注入 preload；
         不预加载就要等 index.mjs 下载并解析完才知道要请求它们，多一段串行等待。
         同源预取不要加 crossorigin，否则会按 CORS 模式再取一次。 -->
    <link rel="modulepreload" href="/vendor/react-19.3.1.mjs" />
    <link rel="modulepreload" href="/vendor/react-dom-19.3.1.mjs" />
    <link rel="modulepreload" href="/vendor/router-8.5.1.mjs" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
